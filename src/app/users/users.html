<table mat-table [dataSource]="users" class="mat-elevation-z8 user-table">

  <!-- Kolumna Index -->
  <ng-container matColumnDef="index">
    <th mat-header-cell *matHeaderCellDef> # </th>
    <td mat-cell *matCellDef="let user; let i = index"> {{ i + 1 }} </td>
  </ng-container>

  <!-- Kolumna Name -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Imię </th>
    <td mat-cell *matCellDef="let user"> {{ user.name }} </td>
  </ng-container>

  <!-- Kolumna Surname -->
  <ng-container matColumnDef="surname">
    <th mat-header-cell *matHeaderCellDef> Nazwisko </th>
    <td mat-cell *matCellDef="let user"> {{ user.surname }} </td>
  </ng-container>

  <!-- Kolumna Role -->
  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef> Rola </th>
    <td mat-cell *matCellDef="let user"> {{ user.role }} </td>
  </ng-container>

  <!-- Kolumna Email -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let user"> {{ user.email }} </td>
  </ng-container>

  <!-- Wiersz nagłówka -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

  <!-- Wiersze z danymi -->
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
